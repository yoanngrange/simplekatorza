<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bande-annonce — simpleKatorza</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F0E0C">
<link rel="icon" type="image/png" href="../favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alatsi&family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:            #0F0E0C;
    --bg-elev:       #1A1815;
    --border:        #2A2620;
    --text:          #F2EDE3;
    --text-muted:    #8A8478;
    --accent:        #FEE304;
    --font-display:   'Alatsi', 'Arial Black', sans-serif;
    --font-editorial: 'Fraunces', 'Georgia', serif;
    --font-body:      'Inter', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  a { color: inherit; text-decoration: none; }

  header {
    padding: 20px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    border-bottom: 1px solid var(--border);
  }
  .back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-muted);
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 100px;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .back:hover { color: var(--text); border-color: var(--text-muted); }
  .back svg { width: 16px; height: 16px; }
  .brand {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 15px;
    color: var(--accent);
  }

  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; gap: 20px; }

  .player-wrap {
    width: 100%;
    max-width: 960px;
    aspect-ratio: 16 / 9;
    background: var(--bg-elev);
    border-radius: 6px;
    overflow: hidden;
    position: relative;
  }
  .player-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  h1.title {
    font-family: var(--font-editorial);
    font-weight: 500;
    font-size: clamp(20px, 3vw, 28px);
    text-align: center;
    max-width: 960px;
  }

  .empty {
    text-align: center;
    color: var(--text-muted);
    font-family: var(--font-editorial);
    font-style: italic;
    font-size: 18px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: center;
  }
</style>
</head>
<body>

<header>
  <a class="back" href="../">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    Accueil
  </a>
  <span class="brand">simpleKatorza</span>
</header>

<main id="main">
  <div class="empty">Chargement…</div>
</main>

<script>
(() => {
  const main = document.getElementById('main');
  const videoId = new URLSearchParams(location.search).get('v');
  const idPattern = /^[A-Za-z0-9_-]{11}$/;

  if (!videoId || !idPattern.test(videoId)) {
    main.innerHTML = `<div class="empty">Bande-annonce introuvable.<a class="back" href="../" style="position:static">Retour à l'accueil</a></div>`;
    return;
  }

  main.innerHTML = `
    <div class="player-wrap">
      <iframe
        src="https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&rel=0"
        title="Bande-annonce"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen
      ></iframe>
    </div>
    <h1 class="title" id="video-title"></h1>
  `;

  // Titre réel de la vidéo via l'oEmbed public YouTube (pas de clé requise) —
  // juste pour l'affichage, un échec n'empêche pas de regarder la vidéo.
  fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent('https://www.youtube.com/watch?v=' + videoId)}&format=json`)
    .then(r => r.ok ? r.json() : null)
    .then(data => {
      if (data?.title) {
        document.getElementById('video-title').textContent = data.title;
        document.title = `${data.title} — simpleKatorza`;
      }
    })
    .catch(() => {});
})();
</script>

</body>
</html>
