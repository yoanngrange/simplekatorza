<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bande-annonce — simpleKatorza</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F0E0C">
<link rel="icon" type="image/png" href="../favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alatsi&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:            #0F0E0C;
    --bg-elev:       #1A1815;
    --bg-elev-2:     #232019;
    --border:        #2A2620;
    --border-strong: #3A342B;
    --text:          #F2EDE3;
    --text-muted:    #8A8478;
    --text-dim:      #5D584F;
    --accent:        #FEE304;
    --font-display:   'Alatsi', 'Arial Black', sans-serif;
    --font-editorial: 'Fraunces', 'Georgia', serif;
    --font-body:      'Inter', system-ui, -apple-system, sans-serif;
    --font-mono:      'IBM Plex Mono', 'Menlo', 'Monaco', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; min-height: 100dvh; }
  a { color: inherit; text-decoration: none; }

  /* --- Header (identique à l'accueil) --- */
  header.masthead {
    padding: 40px 24px 24px;
    max-width: 1180px;
    margin: 0 auto;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  h1.brand { font-family: var(--font-display); font-weight: 400; line-height: 0.95; letter-spacing: 0.005em; margin: 0; }
  .brand-simple { display: block; color: var(--accent); font-size: clamp(14px, 2.4vw, 22px); letter-spacing: 0.18em; margin-bottom: 0.08em; padding-left: 0.15em; }
  .brand-katorza { display: block; font-size: clamp(36px, 7vw, 64px); letter-spacing: 0.005em; white-space: nowrap; }
  .brand-kat { color: var(--text); }
  .brand-rza { color: var(--accent); }
  .brand-o { display: inline-block; position: relative; vertical-align: baseline; }
  .brand-o-letter { visibility: hidden; }
  .brand-cat { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 0.7em; height: 0.7em; }

  .back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-muted);
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 100px;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .back:hover { color: var(--text); border-color: var(--text-muted); }
  .back svg { width: 16px; height: 16px; }

  main { max-width: 1180px; margin: 0 auto; padding: 40px 24px; display: flex; flex-direction: column; align-items: center; gap: 24px; }

  .player-wrap {
    width: 100%;
    max-width: 960px;
    aspect-ratio: 16 / 9;
    background: var(--bg-elev);
    border-radius: 6px;
    overflow: hidden;
    position: relative;
  }
  .player-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  h2.title {
    font-family: var(--font-editorial);
    font-weight: 500;
    font-size: clamp(20px, 3vw, 28px);
    text-align: center;
    max-width: 960px;
  }

  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-muted);
    font-family: var(--font-editorial);
    font-style: italic;
    font-size: 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: center;
  }

  footer.about {
    max-width: 780px;
    margin: 0 auto;
    padding: 32px 24px 40px;
    color: var(--text-muted);
    font-size: 13px;
    line-height: 1.55;
    border-top: 1px solid var(--border);
  }

  @media (max-width: 480px) {
    header.masthead { padding: 28px 16px 16px; }
    main { padding: 24px 16px; }
    footer.about { padding: 20px 16px 24px; font-size: 12px; line-height: 1.5; }
  }
</style>
</head>
<body>

<header class="masthead">
  <h1 class="brand">
    <span class="brand-simple">SIMPLE</span>
    <span class="brand-katorza"><span class="brand-kat">KAT</span><span class="brand-o"><span class="brand-o-letter">O</span><svg class="brand-cat" viewBox="0 0 169 171" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

      <path d="M95.9372 55.0231C100.91 46.0186 113.554 34.8519 118.202 36.5956C123.349 38.528 121.876 45.1609 121.55 54.9971C121.798 58.1111 120.081 67.1473 117.829 72.8179C121.253 78.6975 123.215 85.5345 123.215 92.8288C123.214 100.155 121.232 107.018 117.78 112.915C126.074 124.733 130.178 137.37 130.178 155.09C130.178 155.09 111.175 174.899 84.3195 168.639C58.1746 176.399 35.503 153.846 35.503 153.846C35.503 136.127 40.7114 124.732 49.0044 112.915C45.5528 107.018 43.5728 100.155 43.5727 92.8288C43.5727 85.399 45.609 78.4439 49.1518 72.4915C46.9638 66.8063 45.3238 58.0517 45.5663 54.9971C45.2407 45.1608 43.7649 38.528 48.912 36.5956C53.5437 34.8575 66.1141 45.945 71.1216 54.9336C74.9872 53.6825 79.1128 53.0064 83.3951 53.0064C87.7772 53.0065 91.9939 53.7154 95.9372 55.0231Z" fill="black"/>
      <path d="M76.0272 80.0102C76.0272 76.4366 69.6654 76.4257 65.6399 77.5854C64.4061 77.9408 63.209 78.8981 63.6921 80.0877C64.5877 82.2935 68.1844 85.2376 70.7997 85.2376C74.2847 85.2376 76.0272 85.2376 76.0272 80.0102Z" fill="#FEE304"/>
      <path d="M71.627 80.897C71.627 82.5354 70.9629 83.8636 70.1437 83.8636C69.3245 83.8636 68.6604 82.5354 68.6604 80.897C68.6604 79.2586 70.256 76.3671 70.1437 78.5759C70.256 76.3671 71.627 79.2586 71.627 80.897Z" fill="black"/>
      <path d="M91.3584 80.0102C91.3584 76.4366 97.7202 76.4257 101.746 77.5854C102.98 77.9408 104.177 78.8981 103.694 80.0877C102.798 82.2935 99.2012 85.2376 96.5859 85.2376C93.101 85.2376 91.3584 85.2376 91.3584 80.0102Z" fill="#FEE304"/>
      <path d="M95.7586 80.897C95.7586 82.5354 96.4228 83.8636 97.242 83.8636C98.0612 83.8636 98.7253 82.5354 98.7253 80.897C98.7253 79.2586 97.1297 76.3671 97.242 78.5759C97.1297 76.3671 95.7586 79.2586 95.7586 80.897Z" fill="black"/>
    </svg></span><span class="brand-rza">RZA</span></span>
  </h1>
  <a class="back" href="../">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    Retour au programme
  </a>
</header>

<main id="main">
  <div class="empty">Chargement…</div>
</main>

<footer class="about">
  <p>SimpleKatorza a pour objectif d'offrir une expérience plus rapide et plus simple que le site web du cinéma Katorza à Nantes. Il n'a pas d'objectif financier et n'est pas lié au cinéma Katorza de quelconque façon.</p>
</footer>

<script>
(() => {
  const main = document.getElementById('main');
  const videoId = new URLSearchParams(location.search).get('v');
  const idPattern = /^[A-Za-z0-9_-]{11}$/;

  if (!videoId || !idPattern.test(videoId)) {
    main.innerHTML = `<div class="empty">Bande-annonce introuvable.<a class="back" href="../">Retour à l'accueil</a></div>`;
    return;
  }

  main.innerHTML = `
    <div class="player-wrap">
      <iframe
        src="https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&rel=0"
        title="Bande-annonce"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen
      ></iframe>
    </div>
    <h2 class="title" id="video-title"></h2>
  `;

  // Titre réel de la vidéo via l'oEmbed public YouTube (pas de clé requise) —
  // juste pour l'affichage, un échec n'empêche pas de regarder la vidéo.
  fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent('https://www.youtube.com/watch?v=' + videoId)}&format=json`)
    .then(r => r.ok ? r.json() : null)
    .then(data => {
      if (data?.title) {
        document.getElementById('video-title').textContent = data.title;
        document.title = `${data.title} — simpleKatorza`;
      }
    })
    .catch(() => {});
})();
</script>

</body>
</html>
